<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1000" style="max-width:560px; margin:0 auto; display:block; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- Styles -->
  <style>
    .box { fill:#ffffff; stroke:#bbb; stroke-width:1.5; rx:6; }
    .box-text { font-size:13px; fill:#333; text-anchor:middle; dominant-baseline:central; }
    .group { fill:none; stroke:#999; stroke-width:1.2; stroke-dasharray:4,3; rx:8; }
    .group-label { font-size:11px; fill:#888; font-weight:600; text-anchor:start; }
    .sub-box { fill:#f5f5f5; stroke:#bbb; stroke-width:1; rx:4; }
    .sub-text { font-size:11px; fill:#555; text-anchor:middle; dominant-baseline:central; }
    .arrow-line { stroke:#666; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .note { font-size:12px; fill:#888; font-style:italic; text-anchor:middle; }
  </style>

  <!-- 1. LOAD (subgraph with two sub-boxes) -->
  <rect x="130" y="10" width="300" height="70" class="group"/>
  <text x="145" y="28" class="group-label">Load</text>
  <rect x="150" y="38" width="110" height="30" class="sub-box"/>
  <text x="205" y="53" class="sub-text">Raw Data</text>
  <rect x="300" y="38" width="110" height="30" class="sub-box"/>
  <text x="355" y="53" class="sub-text">Layout File</text>
  <!-- connector between sub-boxes -->
  <line x1="260" y1="53" x2="300" y2="53" stroke="#bbb" stroke-width="1"/>

  <!-- Arrow -->
  <line x1="280" y1="80" x2="280" y2="100" class="arrow-line"/>

  <!-- 2. REREFERENCE -->
  <rect x="180" y="105" width="200" height="36" class="box"/>
  <text x="280" y="123" class="box-text">Rereference</text>
  <line x1="280" y1="141" x2="280" y2="161" class="arrow-line"/>

  <!-- 3. HIGHPASS FILTER -->
  <rect x="180" y="166" width="200" height="36" class="box"/>
  <text x="280" y="184" class="box-text">Highpass Filter</text>
  <line x1="280" y1="202" x2="280" y2="222" class="arrow-line"/>

  <!-- 4. EOG (subgraph) -->
  <rect x="60" y="227" width="440" height="70" class="group"/>
  <text x="75" y="245" class="group-label">EOG</text>
  <rect x="80" y="255" width="130" height="30" class="sub-box"/>
  <text x="145" y="270" class="sub-text">Calculate vEOG/hEOG</text>
  <line x1="210" y1="270" x2="230" y2="270" class="arrow-line"/>
  <rect x="235" y="255" width="120" height="30" class="sub-box"/>
  <text x="295" y="270" class="sub-text">Detect EOG Onsets</text>
  <line x1="355" y1="270" x2="375" y2="270" class="arrow-line"/>
  <rect x="380" y="255" width="105" height="30" class="sub-box"/>
  <text x="432" y="270" class="sub-text">Correlation Matrix</text>
  <line x1="280" y1="297" x2="280" y2="317" class="arrow-line"/>

  <!-- 5. INITIAL EPOCHS -->
  <rect x="130" y="322" width="300" height="36" class="box"/>
  <text x="280" y="340" class="box-text">Initial Epoch + ERP Extraction</text>
  <line x1="280" y1="358" x2="280" y2="378" class="arrow-line"/>

  <!-- 6. ARTIFACT SCAN (subgraph) -->
  <rect x="30" y="383" width="500" height="70" class="group"/>
  <text x="45" y="401" class="group-label">Artifact Scan</text>
  <rect x="45" y="411" width="105" height="30" class="sub-box"/>
  <text x="97" y="426" class="sub-text">Channel Summary</text>
  <line x1="150" y1="426" x2="162" y2="426" class="arrow-line"/>
  <rect x="167" y="411" width="105" height="30" class="sub-box"/>
  <text x="219" y="426" class="sub-text">Extreme Values</text>
  <line x1="272" y1="426" x2="284" y2="426" class="arrow-line"/>
  <rect x="289" y="411" width="105" height="30" class="sub-box"/>
  <text x="341" y="426" class="sub-text">Joint Probability</text>
  <line x1="394" y1="426" x2="406" y2="426" class="arrow-line"/>
  <rect x="411" y="411" width="105" height="30" class="sub-box"/>
  <text x="463" y="426" class="sub-text">Bad Channels</text>
  <line x1="280" y1="453" x2="280" y2="473" class="arrow-line"/>

  <!-- 7. ICA (subgraph) -->
  <rect x="50" y="478" width="460" height="70" class="group"/>
  <text x="65" y="496" class="group-label">ICA</text>
  <rect x="70" y="506" width="95" height="30" class="sub-box"/>
  <text x="117" y="521" class="sub-text">Stricter Highpass</text>
  <line x1="165" y1="521" x2="185" y2="521" class="arrow-line"/>
  <rect x="190" y="506" width="80" height="30" class="sub-box"/>
  <text x="230" y="521" class="sub-text">Run ICA</text>
  <line x1="270" y1="521" x2="290" y2="521" class="arrow-line"/>
  <rect x="295" y="506" width="95" height="30" class="sub-box"/>
  <text x="342" y="521" class="sub-text">Identify Comp.</text>
  <line x1="390" y1="521" x2="405" y2="521" class="arrow-line"/>
  <rect x="410" y="506" width="85" height="30" class="sub-box"/>
  <text x="452" y="521" class="sub-text">Remove Comp.</text>
  <line x1="280" y1="548" x2="280" y2="568" class="arrow-line"/>

  <!-- 8. CHANNEL REPAIR -->
  <rect x="180" y="573" width="200" height="36" class="box"/>
  <text x="280" y="591" class="box-text">Channel Repair</text>
  <line x1="280" y1="609" x2="280" y2="629" class="arrow-line"/>

  <!-- 9. RECALCULATE EOG -->
  <rect x="180" y="634" width="200" height="36" class="box"/>
  <text x="280" y="652" class="box-text">Recalculate EOG</text>
  <line x1="280" y1="670" x2="280" y2="690" class="arrow-line"/>

  <!-- 10. DETECT ARTIFACT VALUES -->
  <rect x="155" y="695" width="250" height="36" class="box"/>
  <text x="280" y="713" class="box-text">Detect Artifact Values</text>
  <line x1="280" y1="731" x2="280" y2="751" class="arrow-line"/>

  <!-- 11. EXTRACT EPOCHS + BASELINE -->
  <rect x="145" y="756" width="270" height="36" class="box"/>
  <text x="280" y="774" class="box-text">Extract Epochs + Baseline</text>
  <line x1="280" y1="792" x2="280" y2="812" class="arrow-line"/>

  <!-- 12. EPOCH QC (subgraph) -->
  <rect x="55" y="817" width="450" height="70" class="group"/>
  <text x="70" y="835" class="group-label">Epoch QC</text>
  <rect x="75" y="845" width="120" height="30" class="sub-box"/>
  <text x="135" y="860" class="sub-text">Detect Bad Epochs</text>
  <line x1="195" y1="860" x2="220" y2="860" class="arrow-line"/>
  <rect x="225" y="845" width="120" height="30" class="sub-box"/>
  <text x="285" y="860" class="sub-text">Repair per Epoch</text>
  <line x1="345" y1="860" x2="365" y2="860" class="arrow-line"/>
  <rect x="370" y="845" width="120" height="30" class="sub-box"/>
  <text x="430" y="860" class="sub-text">Re-detect + Reject</text>
  <line x1="280" y1="887" x2="280" y2="907" class="arrow-line"/>

  <!-- 13. AVERAGE + SAVE -->
  <rect x="160" y="912" width="240" height="36" class="box"/>
  <text x="280" y="930" class="box-text">Average ERPs + Save</text>

  <!-- Loop annotation -->
  <text x="280" y="972" class="note">↻ Repeated for each participant file</text>
</svg>
